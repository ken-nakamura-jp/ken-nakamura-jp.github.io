name: Site layout checks

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint:style-contract
      - name: Build production site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Remove unused CSS, matching deployment
        run: npx --yes purgecss --config purgecss.config.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:site
      - name: Save screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-check-results
          path: test-results/site
          if-no-files-found: ignore
